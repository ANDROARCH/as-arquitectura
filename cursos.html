<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ANDROARQ - Cursos</title>


<style>

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

    font-family:'Segoe UI', sans-serif;

}


body{

    background:#0a0a0a;

    color:white;

    overflow:hidden;

}


/* =====================================================
   CONTENEDOR
===================================================== */

.section{

    display:flex;

    height:100vh;

}


/* =====================================================
   IMAGEN
===================================================== */

.image{

    width:70%;

    background:url('TU-RENDER.jpg') center/cover no-repeat;

    position:relative;

    overflow:hidden;

}


/* =====================================================
   OVERLAY
===================================================== */

.image::after{

    content:"";

    position:absolute;

    inset:0;

    background:linear-gradient(
        to right,
        rgba(0,0,0,0.3),
        rgba(0,0,0,0.85)
    );

}


/* =====================================================
   LIQUID EFFECT
===================================================== */

.liquid{

    position:absolute;

    width:300px;

    height:300px;

    background:radial-gradient(
        circle,
        rgba(255,255,255,0.12),
        transparent 70%
    );

    border-radius:50%;

    pointer-events:none;

    transform:translate(-50%,-50%);

    mix-blend-mode:screen;

}


/* =====================================================
   PANEL
===================================================== */

.panel{

    width:30%;

    padding:60px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    position:relative;

}


/* =====================================================
   GLASS
===================================================== */

.glass{

    position:absolute;

    inset:0;

    backdrop-filter:blur(25px);

    background:rgba(255,255,255,0.03);

    border-left:1px solid rgba(255,255,255,0.1);

}


/* =====================================================
   CONTENIDO
===================================================== */

.content{

    position:relative;

    z-index:2;

}


/* =====================================================
   TITULO
===================================================== */

.title{

    font-size:2rem;

    margin-bottom:10px;

    transition:0.4s;

}


.subtitle{

    font-size:0.9rem;

    color:#cfcfcf;

    margin-bottom:30px;

    transition:0.4s;

}


/* =====================================================
   MENU
===================================================== */

.menu{

    list-style:none;

    margin-bottom:30px;

}


.menu li{

    margin:8px 0;

    opacity:0.5;

    cursor:pointer;

    transition:0.3s;

}


.menu li.active{

    opacity:1;

    font-weight:bold;

}


.menu li:hover{

    opacity:1;

    transform:translateX(5px);

}


/* =====================================================
   DETALLES
===================================================== */

.details{

    opacity:0;

    transform:translateY(15px);

    transition:0.4s;

}


.details.active{

    opacity:1;

    transform:translateY(0);

}


.details p{

    font-size:0.9rem;

    color:#cfcfcf;

    margin-bottom:10px;

}


/* =====================================================
   BOTON
===================================================== */

.btn{

    margin-top:20px;

    display:inline-block;

    padding:12px 22px;

    border-radius:30px;

    border:1px solid white;

    text-decoration:none;

    color:white;

    transition:0.3s;

}


.btn:hover{

    background:white;

    color:black;

}


/* =====================================================
   IDIOMA
===================================================== */

.language-switcher{

    position:absolute;

    top:30px;

    right:40px;

    z-index:10;

    display:flex;

    align-items:center;

    gap:7px;

    font-size:10px;

    letter-spacing:2px;

}


.language-switcher button{

    background:none;

    border:none;

    color:#777;

    cursor:pointer;

    padding:4px;

    font-family:'Segoe UI', sans-serif;

    font-size:10px;

    letter-spacing:2px;

    transition:.3s;

}


.language-switcher button:hover{

    color:#fff;

}


.language-switcher button.active{

    color:#fff;

    font-weight:600;

}


.language-divider{

    color:#444;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:900px){

    .section{

        flex-direction:column;

        overflow:auto;

    }


    .image{

        width:100%;

        height:45vh;

        min-height:300px;

    }


    .panel{

        width:100%;

        min-height:55vh;

        padding:40px 30px;

    }


    .language-switcher{

        top:20px;

        right:20px;

    }

}

</style>

</head>


<body>


<section class="section">


    <!-- =================================================
         IMAGEN
    ================================================== -->

    <div
        class="image"
        id="image"
    >

        <div
            class="liquid"
            id="liquid"
        ></div>

    </div>



    <!-- =================================================
         PANEL
    ================================================== -->

    <div class="panel">


        <div class="glass"></div>



        <!-- =================================================
             IDIOMA
        ================================================== -->

        <div class="language-switcher">


            <button
                id="langES"
                onclick="changeLanguage('es')"
            >

                ES

            </button>


            <span class="language-divider">
                /
            </span>


            <button
                id="langEN"
                onclick="changeLanguage('en')"
            >

                EN

            </button>


        </div>



        <div class="content">


            <!-- =================================================
                 TITULO
            ================================================== -->

            <h1
                class="title"
                id="title"
            >
                SKETCHUP
            </h1>


            <p
                class="subtitle"
                id="subtitle"
            >
                Modelado arquitectónico eficiente
            </p>



            <!-- =================================================
                 MENU
            ================================================== -->

            <ul class="menu">


                <li
                    class="active"
                    onclick="changeCourse(event,'sketchup')"
                    data-es="SketchUp"
                    data-en="SketchUp"
                >
                    SketchUp
                </li>


                <li
                    onclick="changeCourse(event,'archicad')"
                    data-es="Archicad"
                    data-en="Archicad"
                >
                    Archicad
                </li>


                <li
                    onclick="changeCourse(event,'photoshop')"
                    data-es="Photoshop"
                    data-en="Photoshop"
                >
                    Photoshop
                </li>


                <li
                    onclick="changeCourse(event,'indesign')"
                    data-es="InDesign Básico"
                    data-en="InDesign Basics"
                >
                    InDesign Básico
                </li>


                <li
                    onclick="changeCourse(event,'d5')"
                    data-es="D5 Render"
                    data-en="D5 Render"
                >
                    D5 Render
                </li>


                <li
                    onclick="changeCourse(event,'lumion')"
                    data-es="Lumion"
                    data-en="Lumion"
                >
                    Lumion
                </li>


                <li
                    onclick="changeCourse(event,'autocad')"
                    data-es="AutoCAD"
                    data-en="AutoCAD"
                >
                    AutoCAD
                </li>


            </ul>



            <!-- =================================================
                 DETALLES
            ================================================== -->

            <div
                class="details active"
                id="details"
            ></div>



            <!-- =================================================
                 BOTON WHATSAPP
            ================================================== -->

            <a
                href="#"
                class="btn"
                id="whatsappBtn"
            >
                Ver curso
            </a>


        </div>

    </div>

</section>



<script>

/* =====================================================
   CURSO ACTUAL
===================================================== */

let currentCourse = "sketchup";



/* =====================================================
   DATOS DE LOS CURSOS
===================================================== */

const data = {


    sketchup: {

        title: {
            es:"SKETCHUP",
            en:"SKETCHUP"
        },

        subtitle: {
            es:"Modelado arquitectónico eficiente",
            en:"Efficient architectural modeling"
        },

        details: {

            es:[
                "Introducción",
                "Modelado básico",
                "Componentes",
                "Escenas"
            ],

            en:[
                "Introduction",
                "Basic modeling",
                "Components",
                "Scenes"
            ]

        }

    },


    archicad: {

        title: {
            es:"ARCHICAD",
            en:"ARCHICAD"
        },

        subtitle: {
            es:"Modelado BIM profesional",
            en:"Professional BIM modeling"
        },

        details: {

            es:[
                "Interfaz",
                "Muros",
                "Planos",
                "Layouts"
            ],

            en:[
                "Interface",
                "Walls",
                "Plans",
                "Layouts"
            ]

        }

    },


    photoshop: {

        title: {
            es:"PHOTOSHOP",
            en:"PHOTOSHOP"
        },

        subtitle: {
            es:"Postproducción de renders",
            en:"Render post-production"
        },

        details: {

            es:[
                "Color",
                "Texturas",
                "Ambiente",
                "Realismo"
            ],

            en:[
                "Color",
                "Textures",
                "Atmosphere",
                "Realism"
            ]

        }

    },


    indesign: {

        title: {
            es:"INDESIGN",
            en:"INDESIGN"
        },

        subtitle: {
            es:"Diagramación arquitectónica",
            en:"Architectural layout design"
        },

        details: {

            es:[
                "Láminas",
                "Tipografía",
                "Portafolio",
                "Exportación"
            ],

            en:[
                "Boards",
                "Typography",
                "Portfolio",
                "Export"
            ]

        }

    },


    d5: {

        title: {
            es:"D5 RENDER",
            en:"D5 RENDER"
        },

        subtitle: {
            es:"Render en tiempo real",
            en:"Real-time rendering"
        },

        details: {

            es:[
                "Iluminación",
                "Materiales",
                "Escenas",
                "Render"
            ],

            en:[
                "Lighting",
                "Materials",
                "Scenes",
                "Rendering"
            ]

        }

    },


    lumion: {

        title: {
            es:"LUMION",
            en:"LUMION"
        },

        subtitle: {
            es:"Visualización avanzada",
            en:"Advanced visualization"
        },

        details: {

            es:[
                "Vegetación",
                "Clima",
                "Animación",
                "Render"
            ],

            en:[
                "Vegetation",
                "Weather",
                "Animation",
                "Rendering"
            ]

        }

    },


    autocad: {

        title: {
            es:"AUTOCAD",
            en:"AUTOCAD"
        },

        subtitle: {
            es:"Dibujo técnico",
            en:"Technical drafting"
        },

        details: {

            es:[
                "Comandos",
                "Capas",
                "Planos",
                "Impresión"
            ],

            en:[
                "Commands",
                "Layers",
                "Plans",
                "Printing"
            ]

        }

    }

};



/* =====================================================
   IDIOMA ACTUAL
===================================================== */

let currentLanguage =
    localStorage.getItem(
        "androarq-language"
    ) || "es";



/* =====================================================
   CAMBIAR CURSO
===================================================== */

function changeCourse(event, course){


    currentCourse =
        course;


    const selected =
        data[course];


    document.getElementById(
        "title"
    ).innerText =
        selected.title[currentLanguage];


    document.getElementById(
        "subtitle"
    ).innerText =
        selected.subtitle[currentLanguage];


    const detailsDiv =
        document.getElementById(
            "details"
        );


    detailsDiv.classList.remove(
        "active"
    );


    setTimeout(() => {


        detailsDiv.innerHTML =
            selected.details[
                currentLanguage
            ]
            .map(
                detail =>
                `<p>${detail}</p>`
            )
            .join("");


        detailsDiv.classList.add(
            "active"
        );


    },200);



    document
        .querySelectorAll(".menu li")
        .forEach(
            li =>
            li.classList.remove("active")
        );


    event.target.classList.add(
        "active"
    );

}



/* =====================================================
   CAMBIAR IDIOMA
===================================================== */

function changeLanguage(language){


    currentLanguage =
        language;


    localStorage.setItem(
        "androarq-language",
        language
    );


    document.documentElement.lang =
        language;


    const selected =
        data[currentCourse];


    document.getElementById(
        "title"
    ).innerText =
        selected.title[language];


    document.getElementById(
        "subtitle"
    ).innerText =
        selected.subtitle[language];


    const detailsDiv =
        document.getElementById(
            "details"
        );


    detailsDiv.classList.remove(
        "active"
    );


    setTimeout(() => {


        detailsDiv.innerHTML =
            selected.details[
                language
            ]
            .map(
                detail =>
                `<p>${detail}</p>`
            )
            .join("");


        detailsDiv.classList.add(
            "active"
        );


    },200);



    /* MENU */

    document
        .querySelectorAll(".menu li")
        .forEach(li => {

            const text =
                li.getAttribute(
                    `data-${language}`
                );


            if(text){

                li.innerText =
                    text;

            }

        });



    /* BOTONES */

    document.getElementById(
        "langES"
    ).classList.toggle(
        "active",
        language === "es"
    );


    document.getElementById(
        "langEN"
    ).classList.toggle(
        "active",
        language === "en"
    );


    /* BOTÓN */

    document.getElementById(
        "whatsappBtn"
    ).innerText =
        language === "es"
        ? "Ver curso"
        : "View course";

}



/* =====================================================
   INICIALIZAR
===================================================== */

function initializeCourse(){


    const selected =
        data[currentCourse];


    document.getElementById(
        "title"
    ).innerText =
        selected.title[currentLanguage];


    document.getElementById(
        "subtitle"
    ).innerText =
        selected.subtitle[currentLanguage];


    document.getElementById(
        "details"
    ).innerHTML =
        selected.details[
            currentLanguage
        ]
        .map(
            detail =>
            `<p>${detail}</p>`
        )
        .join("");


    document.getElementById(
        "langES"
    ).classList.toggle(
        "active",
        currentLanguage === "es"
    );


    document.getElementById(
        "langEN"
    ).classList.toggle(
        "active",
        currentLanguage === "en"
    );


    document.getElementById(
        "whatsappBtn"
    ).innerText =
        currentLanguage === "es"
        ? "Ver curso"
        : "View course";


    document
        .querySelectorAll(".menu li")
        .forEach(li => {

            const text =
                li.getAttribute(
                    `data-${currentLanguage}`
                );


            if(text){

                li.innerText =
                    text;

            }

        });

}


initializeCourse();



/* =====================================================
   LIQUID EFFECT
===================================================== */

const liquid =
    document.getElementById(
        "liquid"
    );


document
    .getElementById("image")
    .addEventListener(
        "mousemove",
        (e) => {


            liquid.style.left =
                e.clientX + "px";


            liquid.style.top =
                e.clientY + "px";


        }
    );



/* =====================================================
   WHATSAPP
===================================================== */

document
    .getElementById("whatsappBtn")
    .addEventListener(
        "click",
        function(e){


            e.preventDefault();


            const course =
                data[currentCourse]
                .title[currentLanguage];


            let message;


            if(currentLanguage === "es"){

                message =
                    `Hola, deseo aprender ${course}`;

            }else{

                message =
                    `Hello, I would like to learn ${course}`;

            }


            const url =
                `https://wa.me/593984527298?text=${encodeURIComponent(message)}`;


            window.open(
                url,
                "_blank"
            );


        }
    );

</script>


</body>

</html>
